<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mojogames Studio</title>
<meta name="description" content="Mojogames Studio. Play Atlas of Wanderworlds free in your browser, on phones too.">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-top: #05040f;
    --bg-bottom: #100a24;
    --text: #fff6e8;
    --dim: #c9b8e6;
    --panel: #1d1538e8;
    --border: #b98fd1;
    --play: #e89a5c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: linear-gradient(var(--bg-top), var(--bg-bottom)) fixed;
    color: var(--text);
    font-family: "Silkscreen", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px;
  }
  /* Stars: drawn at low resolution and scaled up with square pixels. */
  #stars {
    position: fixed; inset: 0; width: 100%; height: 100%;
    image-rendering: pixelated; z-index: -1;
  }
  .logo { width: min(640px, 100%); height: auto; margin: 8px 0 24px; }
  .game {
    display: flex; gap: 20px; align-items: center;
    background: var(--panel); border: 3px solid #000; outline: 2px solid var(--border);
    padding: 18px; width: min(560px, 100%);
  }
  .game img { width: 112px; height: 112px; image-rendering: pixelated; flex: none; }
  .game h1 { font-size: 22px; margin: 0 0 6px; font-weight: 400; line-height: 1.1; }
  .game p { margin: 0 0 14px; color: var(--dim); font-size: 13px; line-height: 1.5; }
  .play {
    display: inline-block; text-decoration: none; color: #1a0f08;
    background: var(--play); border: 3px solid #000; padding: 8px 22px;
    font-family: inherit; font-size: 18px;
    box-shadow: 0 0 0 2px var(--text);
  }
  .play:hover, .play:focus-visible { background: #f2c6a0; }
  footer { margin-top: auto; padding-top: 32px; color: var(--dim); font-size: 11px; }
  @media (max-width: 600px) {
    .game { flex-direction: column; text-align: center; }
  }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<img class="logo" src="img/mojogames-logo.png" alt="Mojogames" width="900" height="375">
<section class="game">
  <img src="img/atlas-icon.png" alt="" width="112" height="112">
  <div>
    <h1>Atlas of Wanderworlds</h1>
    <p>Free to play in your browser, on phones too. Early prototype.</p>
    <a class="play" href="atlas/">Play</a>
  </div>
</section>
<footer>&copy; 2026 Mojogames Studio</footer>
<script>
  // Dim single-pixel stars with slight rainbow tints and a few bright ones,
  // like the game's title screen. Redrawn on resize.
  (function () {
    var c = document.getElementById('stars');
    var ctx = c.getContext('2d');
    function draw() {
      var scale = 3;
      c.width = Math.ceil(innerWidth / scale);
      c.height = Math.ceil(innerHeight / scale);
      ctx.clearRect(0, 0, c.width, c.height);
      var seed = 7;
      function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
      var count = Math.floor(c.width * c.height * 0.012);
      for (var i = 0; i < count; i++) {
        var x = Math.floor(rnd() * c.width), y = Math.floor(rnd() * c.height);
        var hue = Math.floor(rnd() * 360), light = 45 + rnd() * 40;
        ctx.fillStyle = 'hsla(' + hue + ',60%,' + light + '%,' + (0.25 + rnd() * 0.5) + ')';
        ctx.fillRect(x, y, 1, 1);
        if (rnd() < 0.03) {
          ctx.fillStyle = 'rgba(255,246,232,0.9)';
          ctx.fillRect(x - 1, y, 3, 1);
          ctx.fillRect(x, y - 1, 1, 3);
        }
      }
    }
    draw();
    addEventListener('resize', draw);
  })();
</script>
</body>
</html>
