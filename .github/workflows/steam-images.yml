name: Steam images

# Keeps the game cards on the current Steam header images.
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:         # run now from the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: steam-images
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update header image URLs
        run: python tools/update_steam_images.py
      - name: Commit and rebuild the site if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A index.html img/steam
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Steam header images"
          git pull --rebase
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
