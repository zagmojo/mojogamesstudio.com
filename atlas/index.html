html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #05040f;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

/* Atlas (user, 2026-11-01): the planet turns while the game loads; still only as an app
   icon. Frames from tools/make_icon.gd (icons/spin_sheet.png, copied next to this page). */
#status-spin {
	width: 192px;
	height: 192px;
	margin: auto;
	background: url("spin_sheet.png") 0 0 no-repeat;
	image-rendering: pixelated;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

// Sound that stops mid-game (user, 2026-11-04): a browser suspends the page's audio (Chrome
// with the tab in the background) or interrupts it (Safari: a call, the lock screen, another
// app's sound), and it doesn't always come back by itself. Every audio context the engine
// makes is kept here; on the next tap, click or key, and when the page shows again, any one
// not running is resumed (a browser lets audio start only after a gesture). The game asks
// window.atlasAudioState() how they stand and logs it (core/sfx.gd).
(function () {
	var Orig = window.AudioContext || window.webkitAudioContext;
	if (!Orig) { return; }
	var ctxs = [];
	function Kept(opts) { var c = new Orig(opts); ctxs.push(c); return c; }
	Kept.prototype = Orig.prototype;
	window.AudioContext = Kept;
	if (window.webkitAudioContext) { window.webkitAudioContext = Kept; }
	function resume() {
		ctxs.forEach(function (c) {
			if (c.state !== 'running' && c.state !== 'closed') { c.resume().catch(function () {}); }
		});
	}
	['pointerdown', 'pointerup', 'touchend', 'mousedown', 'keydown'].forEach(function (t) {
		window.addEventListener(t, resume, {capture: true, passive: true});
	});
	document.addEventListener('visibilitychange', function () { if (!document.hidden) { resume(); } });
	window.addEventListener('focus', resume);
	window.atlasAudioState = function () { return ctxs.map(function (c) { return c.state; }).join(',') || 'none'; };
})();

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":3413972,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// Graphics debugging (?gldebug=1; user report 2026-11-01: Windows browsers lost the
// graphics entering a world): remembers the last graphics calls, the biggest buffers and
// textures made, and prints them when the graphics are lost.
if (new URLSearchParams(location.search).get('gldebug')) {
	const recent = [];
	const big = [];
	const realGet = HTMLCanvasElement.prototype.getContext;
	HTMLCanvasElement.prototype.getContext = function (kind, attrs) {
		const ctx = realGet.call(this, kind, attrs);
		if (!ctx || ctx.__wrapped || !(kind === 'webgl2' || kind === 'webgl')) {
			return ctx;
		}
		ctx.__wrapped = true;
		const proto = Object.getPrototypeOf(ctx);
		for (const name of Object.getOwnPropertyNames(proto)) {
			const d = Object.getOwnPropertyDescriptor(proto, name);
			if (!d || typeof d.value !== 'function' || name === 'getError') {
				continue;
			}
			const real = d.value;
			ctx[name] = function (...a) {
				const brief = a.map((x) => (typeof x === 'number' ? x : (x && x.byteLength !== undefined ? 'bytes:' + x.byteLength : typeof x))).join(',');
				recent.push(name + '(' + brief + ')');
				if (recent.length > 60) {
					recent.shift();
				}
				if (/bufferData|texImage2D|texImage3D|texStorage|renderbufferStorage/.test(name)) {
					let sz = 0;
					if (name === 'bufferData') {
						sz = typeof a[1] === 'number' ? a[1] : (typeof a[4] === 'number' ? a[4] : (a[1] ? a[1].byteLength : 0));
					} else if (name === 'texImage2D' || name === 'texStorage2D') {
						sz = (name === 'texStorage2D' ? a[3] * a[4] : a[3] * a[4]) * 4;
					} else if (name === 'texImage3D' || name === 'texStorage3D') {
						sz = a[3] * a[4] * a[5] * 4;
					} else if (name.startsWith('renderbufferStorage')) {
						sz = a[a.length - 2] * a[a.length - 1] * 4;
					}
					big.push([sz, name + '(' + a.slice(0, 6).map((x) => (typeof x === 'number' ? x : typeof x)).join(',') + ') at ' + recent.length]);
					if (sz > 4000000) {
						console.warn('GLDEBUG big allocation: ' + sz + ' ' + name + '(' + a.slice(0, 6).map((x) => (typeof x === 'number' ? x : typeof x)).join(',') + ')');
					}
					big.sort((p, q) => q[0] - p[0]);
					big.length = Math.min(big.length, 15);
				}
				if (name === 'shaderSource') {
					a[0].__src = a[1];
				}
				const r = real.apply(this, a);
				if (name === 'linkProgram' && !ctx.isContextLost()) {
					window.__links = window.__links || [];
					window.__links.push({ok: ctx.getProgramParameter(a[0], ctx.LINK_STATUS), log: ctx.getProgramInfoLog(a[0]), at: performance.now(), n: (window.__shaders || []).length});
				}
				if (name === 'compileShader' && !ctx.isContextLost()) {
					const ok = ctx.getShaderParameter(a[0], ctx.COMPILE_STATUS);
					window.__shaders = window.__shaders || [];
					window.__shaders.push({ok: ok, src: a[0].__src, log: ctx.getShaderInfoLog(a[0]), at: performance.now()});
				}
				if (name === 'drawArrays' || name === 'drawElements' || name === 'drawArraysInstanced' || name === 'drawElementsInstanced') {
					const e = ctx.isContextLost() ? 'LOST' : '';
					if (e) {
						recent.push('^ lost after this');
					}
				}
				return r;
			};
		}
		this.addEventListener('webglcontextlost', () => {
			console.error('GLDEBUG lost; last calls:\n' + recent.join('\n'));
			console.error('GLDEBUG biggest allocations:\n' + big.map((b) => b[0] + ' ' + b[1]).join('\n'));
		});
		return ctx;
	};
}

(function () {
	const SPIN_FRAMES = 48, SPIN_COLS = 8, SPIN_PX = 192, SPIN_S = 8;
	const spin = document.getElementById('status-spin');
	if (spin) {
		const start = performance.now();
		const turn = function (now) {
			const f = Math.floor(((now - start) / 1000 / SPIN_S * SPIN_FRAMES)) % SPIN_FRAMES;
			spin.style.backgroundPosition = (-(f % SPIN_COLS) * SPIN_PX) + 'px ' + (-Math.floor(f / SPIN_COLS) * SPIN_PX) + 'px';
			if (spin.offsetParent !== null) { requestAnimationFrame(turn); }
		};
		requestAnimationFrame(turn);
	}

	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		// Test switches from the address (?args=--solo+--seed=5): passed to the game like
		// command-line test hooks (scenes/main.gd), for checking a browser's trouble.
		const testArgs = new URLSearchParams(location.search).get('args');
		engine.startGame({
			'args': testArgs ? ['--'].concat(testArgs.split(' ').filter((a) => a.startsWith('--'))) : [],
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
